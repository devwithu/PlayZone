# backend/ 전체 검사: JS 린트·타입 검사, Pint, PHPStan, PHPUnit (composer ci:check)
# 로컬 Docker와 같은 PostgreSQL 18 테스트 DB(game_evaluation_test, 포트 5433)를 띄워 실행한다.
name: tests

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/tests.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: game_evaluation_test
          POSTGRES_USER: game_user
          POSTGRES_PASSWORD: secret
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U game_user -d game_evaluation_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          extensions: pdo_pgsql, intl, mbstring, gd, zip, bcmath, curl, xml
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # 로컬은 docker/postgres/init/01-init.sql이 만드는 확장. 서비스 컨테이너에는 직접 만든다
      - name: Prepare test database
        run: psql -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm;'
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5433
          PGUSER: game_user
          PGPASSWORD: secret
          PGDATABASE: game_evaluation_test

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Install JS dependencies
        run: npm ci --no-audit --no-fund

      # Inertia 페이지 테스트가 읽는 Vite manifest와 Wayfinder 타입 라우트를 만든다
      - name: Build assets
        run: npm run build

      - name: Run CI checks
        run: composer ci:check
